<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Portfolio OS</title>
  <!-- 98.css library for native Windows 98 styling -->
  <link rel="stylesheet" href="https://unpkg.com/98.css" />
  <style>
    body {
      background-color: #008080;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
    }

    #desktop {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: flex-start;
    }

    .start-menu {
      display: none;
      position: fixed;
      bottom: 38px;
      left: 0;
      width: 320px;
      height: 280px;
      background: #2b5b84;
      border: 2px solid #002b49;
      border-radius: 5px 5px 0 0;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.5);
      z-index: 2000;
    }

    .start-menu-left {
      width: 50%;
      background: #ffffff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid #999;
    }

    .start-menu-right {
      width: 50%;
      background: #1e3d59;
      color: white;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid #ffffff;
      box-sizing: border-box;
    }

    .user-name {
      font-weight: bold;
      font-size: 13px;
      color: #ffffff;
    }

    .menu-item, .menu-item-dark {
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
    }

    .menu-item:hover {
      background: #2980b9;
      color: white;
    }

    .menu-item-dark:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .desktop-icon {
      width: 70px;
      text-align: center;
      color: white;
      cursor: pointer;
      text-shadow: 1px 1px 1px black;
      background: transparent;
      border: none;
    }

    .desktop-icon:hover {
      background-color: rgba(0, 0, 128, 0.4);
    }

    .icon-img {
      width: 32px;
      height: 32px;
      display: block;
      margin: 0 auto 4px auto;
    }

    .window {
      position: absolute;
      z-index: 10;
      display: none;
    }

    .title-bar {
      cursor: move;
      user-select: none;
    }

    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38px;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      display: flex;
      align-items: center;
      padding: 2px 6px;
      justify-content: space-between;
      box-sizing: border-box;
      z-index: 1000;
    }

    .taskbar-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .system-tray {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border: 2px inset #dfdfdf;
      background: #c0c0c0;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .system-tray:hover {
      background: #d4d4d4;
    }

    /* Modular Notification Toast Shell */
    .notification-toast {
      position: fixed;
      bottom: 48px;
      right: 16px;
      width: 290px;
      z-index: 3000;
      display: none;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.4);
      animation: popUp 0.3s ease-out;
    }

    @keyframes popUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Desktop Icons Container -->
  <div id="desktop"></div>

  <!-- App Windows Container -->
  <div id="windows-container"></div>

  <!-- Reusable Desktop Notification Shell -->
  <div id="boss-notification" class="window notification-toast">
    <div class="title-bar">
      <div class="title-bar-text" id="notification-title">💬 Message from The Boss</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeNotification()"></button>
      </div>
    </div>
    <div class="window-body" id="notification-body"></div>
  </div>

  <!-- Start Menu Popup -->
  <div id="start-menu" class="start-menu">
    <div class="start-menu-left"></div>

    <div class="start-menu-right">
      <div class="user-profile">
        <img src="assets/images/user_profile_pic.png" alt="Tybo Verslype" class="profile-avatar" />
        <span class="user-name">Tybo Verslype</span>
      </div>

      <div class="menu-item-dark" onclick="openWindow('resume-window'); toggleStartMenu();">
        📁 My Documents
      </div>
      <div class="menu-item-dark" onclick="alert('Access Restricted: Admin Privileges Required');">
        ⚙️ Control Panel
      </div>
      <div class="menu-item-dark" onclick="alert('Session Locked');">
        🔒 Log Off
      </div>
    </div>
  </div>

  <!-- Fixed Taskbar -->
  <div id="taskbar">
    <div class="taskbar-left">
      <button id="start-button" onclick="toggleStartMenu()" style="display: flex; align-items: center; justify-content: center; padding: 3px 6px; cursor: pointer;" aria-label="Start Menu">
        <img src="assets/images/windows_logo.png" alt="Start" style="height: 22px; width: auto; display: block;" />
      </button>

      <a href="assets/docs/resume.pdf" target="_blank">
        <button style="color: darkblue; font-weight: bold; cursor: pointer;">Fast-Pass (PDF)</button>
      </a>
    </div>

    <!-- System Tray with Clock & Calendar Trigger -->
    <div class="system-tray" onclick="openWindow('calendar-window')" title="Click to open Calendar">
      <img src="https://win98icons.alexmeub.com/icons/png/calendar-0.png" alt="Calendar" style="width: 16px; height: 16px;" />
      <span id="tray-clock">12:00 PM</span>
    </div>
  </div>

  <!-- Load External App Configuration -->
  <script src="js/apps-config.js"></script>

  <script>
    // State Tracking
    window.step1Done = false;
    window.step2Done = false;

    // Cross-origin message listener for iframe events
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'STEP_1_COMPLETE') {
        completeStep1();
      }
    });

    // Helper function to fetch and load HTML files into any window
    function loadWindowContent(windowId, contentUrl) {
      const win = document.getElementById(windowId);
      if (!win) return;

      const winBody = win.querySelector('.window-body');
      if (!winBody) return;

      winBody.innerHTML = 'Loading...';
      fetch(contentUrl)
        .then(res => res.text())
        .then(html => {
          winBody.innerHTML = html;

          // Re-trigger script execution for fetched modular app content
          winBody.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
        })
        .catch(() => {
          winBody.innerHTML = `<p style="color: red;">Error loading app content.</p>`;
        });
    }

    // Web Audio API Retro System Notification Chime
    function playNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // Classic retro dual-tone ding (D5 -> A5)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);

        // Fade out volume
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        // Browsers block autoplay until the first user click
        console.warn('Audio playback waiting for user interaction.', e);
      }
    }

    // Dynamic Notification Launcher
    function showNotification(contentUrl, title = '💬 Message from The Boss') {
      const notif = document.getElementById('boss-notification');
      const notifTitle = document.getElementById('notification-title');
      const notifBody = document.getElementById('notification-body');

      if (!notif || !notifBody) return;

      if (title) notifTitle.innerText = title;

      fetch(contentUrl)
        .then(res => res.text())
        .then(html => {
          notifBody.innerHTML = html;
          notif.style.display = 'block';
          playNotificationSound(); // Play notification chime
        })
        .catch(() => {
          notifBody.innerHTML = '<p style="color: red; padding: 10px;">Error loading notification content.</p>';
          notif.style.display = 'block';
          playNotificationSound(); // Play notification chime
        });
    }

    function closeNotification() {
      const notif = document.getElementById('boss-notification');
      if (notif) {
        notif.style.display = 'none';
      }
    }

    // System Tray Clock Logic
    function updateTrayClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;

      const clockElement = document.getElementById('tray-clock');
      if (clockElement) {
        clockElement.innerText = `${hours}:${minutes} ${ampm}`;
      }
    }

    // Initialize OS Interface
    function initOS() {
      const desktop = document.getElementById('desktop');
      const startMenuLeft = document.querySelector('.start-menu-left');
      const windowsContainer = document.getElementById('windows-container');

      APPS_CONFIG.forEach(app => {
        // 1. Desktop Icon
        if (app.showOnDesktop !== false) {
          const iconDiv = document.createElement('div');
          iconDiv.className = 'desktop-icon';
          iconDiv.onclick = () => openWindow(app.id);
          iconDiv.innerHTML = `
            <img src="${app.icon}" alt="${app.label}" class="icon-img" />
            <span>${app.label}</span>
          `;
          desktop.appendChild(iconDiv);
        }

        // 2. Start Menu Link
        if (app.showInStartMenu !== false) {
          const menuItem = document.createElement('div');
          menuItem.className = 'menu-item';
          menuItem.style.display = 'flex';
          menuItem.style.alignItems = 'center';
          menuItem.style.gap = '6px';
          menuItem.onclick = () => { openWindow(app.id); toggleStartMenu(); };
          menuItem.innerHTML = `
            <img src="${app.icon}" alt="${app.label}" style="width: 16px; height: 16px;" />
            <span>${app.label}</span>
          `;
          startMenuLeft.appendChild(menuItem);
        }

        // 3. App Window Shell
        const winDiv = document.createElement('div');
        winDiv.className = 'window';
        winDiv.id = app.id;
        winDiv.style.width = app.width || '340px';
        if (app.height) winDiv.style.height = app.height;
        winDiv.style.top = app.top || '60px';
        winDiv.style.left = app.left || '100px';

        if (app.type === 'browser') {
          winDiv.innerHTML = `
            <div class="title-bar">
              <div class="title-bar-text" id="browser-title">${app.title}</div>
              <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('${app.id}')"></button>
              </div>
            </div>
            <div class="window-body" style="display: flex; flex-direction: column; height: calc(100% - 36px); gap: 6px;">
              <div style="display: flex; gap: 4px; align-items: center;">
                <button onclick="resetBrowserHome()">🏠</button>
                <input type="text" id="address-bar" value="https://www.google.com" placeholder="Type URL (e.g. oasis.com)..." style="flex-grow: 1;" onkeydown="if(event.key === 'Enter') navigateToUrl()" />
                <button onclick="navigateToUrl()" style="font-weight: bold;">Go</button>
              </div>
              <iframe id="browser-frame" src="${app.startPage}" style="width: 100%; flex-grow: 1; border: 2px inset #dfdfdf; background: white;"></iframe>
            </div>
          `;
        } else {
          winDiv.innerHTML = `
            <div class="title-bar">
              <div class="title-bar-text">${app.title}</div>
              <div class="title-bar-controls">
                <button aria-label="Close" onclick="closeWindow('${app.id}')"></button>
              </div>
            </div>
            <div class="window-body"></div>
          `;
        }

        windowsContainer.appendChild(winDiv);

        if (app.type !== 'browser' && app.contentUrl) {
          loadWindowContent(app.id, app.contentUrl);
        }

        if (app.autoOpen) {
          openWindow(app.id);
        }
      });

      setupDragging();
      updateTrayClock();
      setInterval(updateTrayClock, 1000);
    }

    // Step 1 Completion Handler
    function completeStep1() {
      if (window.step1Done) return;
      window.step1Done = true;

      openWindow('clues-window');
      loadWindowContent('clues-window', 'apps/briefing/step2.html');
      showNotification('apps/notifications/step1_complete.html');
    }

    // Step 2 Completion Handler
    function completeStep2() {
      // Prevents completion out of order or if already completed
      if (!window.step1Done || window.step2Done) return;
      window.step2Done = true;

      // Update briefing window to Step 3
      openWindow('clues-window');
      loadWindowContent('clues-window', 'apps/briefing/step3.html');

      // Trigger notification
      showNotification('apps/notifications/step2_complete.html', '💬 Message from The Boss');
    }

    // Browser URL Routing Logic
    function navigateToUrl() {
      const input = document.getElementById('address-bar').value.trim().toLowerCase();
      const frame = document.getElementById('browser-frame');
      const title = document.getElementById('browser-title');

      frame.removeAttribute('srcdoc');

      if (input.includes('oasis')) {
        frame.src = 'apps/browser/oasis.html';
        document.getElementById('address-bar').value = 'https://oasis.ugent.be/portal';
        title.innerText = 'Microsoft Edge - Ghent University OASIS Portal';
      } else {
        frame.srcdoc = `
          <html>
            <body style="font-family: Arial, sans-serif; padding: 20px; text-align: center; color: #555;">
              <h2>⚠️ 404 - Server Not Found</h2>
              <p>The address <strong>${input}</strong> could not be reached.</p>
            </body>
          </html>`;
        title.innerText = 'Microsoft Edge - 404 Not Found';
      }
    }

    function resetBrowserHome() {
      const frame = document.getElementById('browser-frame');
      document.getElementById('address-bar').value = 'https://www.google.com';
      document.getElementById('browser-title').innerText = 'Microsoft Edge - Start Page';
      frame.removeAttribute('srcdoc');
      frame.src = 'apps/browser/start_page.html';
    }

    // Toggle Hint visibility in Mission Briefing
    function toggleHint() {
      const hintText = document.getElementById('hint-text');
      const hintBtn = document.getElementById('hint-btn');

      if (hintText.style.display === 'none') {
        hintText.style.display = 'block';
        hintBtn.innerText = 'Hide Hint';
      } else {
        hintText.style.display = 'none';
        hintBtn.innerText = 'Show Hint';
      }
    }

    // Start Menu Visibility Toggle
    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
    }

    // Dismiss Start Menu on background click
    document.addEventListener('click', (event) => {
      const menu = document.getElementById('start-menu');
      const button = document.getElementById('start-button');

      if (menu && button && !menu.contains(event.target) && !button.contains(event.target)) {
        menu.style.display = 'none';
      }
    });

    // Window Dragging Functionality
    function setupDragging() {
      document.querySelectorAll('.window').forEach(win => {
        const titleBar = win.querySelector('.title-bar');
        let isDragging = false;
        let offsetX = 0, offsetY = 0;

        if (!titleBar) return;

        titleBar.addEventListener('mousedown', (e) => {
          isDragging = true;
          offsetX = e.clientX - win.offsetLeft;
          offsetY = e.clientY - win.offsetTop;

          document.querySelectorAll('.window').forEach(w => w.style.zIndex = '10');
          win.style.zIndex = '100';
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          win.style.left = `${e.clientX - offsetX}px`;
          win.style.top = `${e.clientY - offsetY}px`;
        });

        document.addEventListener('mouseup', () => isDragging = false);
      });
    }

    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openWindow(id) {
      const win = document.getElementById(id);
      if (win) {
        win.style.display = 'block';
        win.style.zIndex = '100';
      }
    }

    document.addEventListener('DOMContentLoaded', initOS);
  </script>
</body>
</html>
