<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RetroSoft Software</title>
  <style>
    body {
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
      padding: 16px;
      background: white;
      color: #000;
      font-size: 12px;
      margin: 0;
    }
    h2 {
      color: #000080;
      border-bottom: 2px solid #000080;
      padding-bottom: 4px;
      margin-top: 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>RetroSoft Shareware (1998)</h2>
  <p>Welcome to the software library mirror. Select a package below to download:</p>
  <ul style="line-height: 1.8;">
    <li>
      <a href="#" onclick="startDownload(); return false;" style="color: blue; text-decoration: underline;">
        Outlook Express v5.0 Setup (Email Client)
      </a> - <b>1.4 MB</b>
    </li>
  </ul>

  <div id="progress-container" style="display: none; margin-top: 16px;">
    <p id="dl-status-text" style="margin: 0 0 4px 0; font-size: 11px;">Initializing transfer...</p>
    <div style="width: 100%; height: 18px; background: #fff; border: 2px inset #dfdfdf; position: relative;">
      <div id="progress-bar" style="width: 0%; height: 100%; background: #000080;"></div>
    </div>
  </div>

  <script>
    function startDownload() {
      const container = document.getElementById('progress-container');
      const bar = document.getElementById('progress-bar');
      const text = document.getElementById('dl-status-text');
      container.style.display = 'block';

      let progress = 0;
      let interval = setInterval(() => {
        progress += Math.floor(Math.random() * 20) + 10;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          bar.style.width = '100%';
          text.innerText = 'Download complete! Registering application...';

          setTimeout(() => {
            if (window.parent && window.parent.unlockMailApp) {
              window.parent.unlockMailApp();
            }
            text.innerText = 'Success! Outlook Express is now installed on your system.';
          }, 600);
        } else {
          bar.style.width = progress + '%';
          text.innerText = `Downloading outlook_setup.exe... ${progress}%`;
        }
      }, 250);
    }
  </script>
</body>
</html>
