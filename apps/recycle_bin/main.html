<div class="window-body" style="margin: 0; padding: 0; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; background: #c0c0c0; user-select: none;">
  <!-- Explorer Menu Bar -->
  <div style="display: flex; gap: 12px; padding: 2px 6px; background: #c0c0c0; border-bottom: 1px solid #808080; font-size: 11px; color: #000;">
    <span style="cursor: pointer;"><u>F</u>ile</span>
    <span style="cursor: pointer;"><u>E</u>dit</span>
    <span style="cursor: pointer;"><u>V</u>iew</span>
    <span style="cursor: pointer;"><u>G</u>o</span>
    <span style="cursor: pointer;">F<u>a</u>vorites</span>
    <span style="cursor: pointer;"><u>H</u>elp</span>
  </div>

  <!-- Address Bar -->
  <div style="display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: #c0c0c0; border-bottom: 2px inset #fff; font-size: 11px;">
    <span>Address</span>
    <div style="flex-grow: 1; background: #fff; border: 2px inset #dfdfdf; padding: 1px 4px; color: #000;">
      <img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_full-2.png" alt="" style="width: 16px; height: 16px; vertical-align: middle; image-rendering: pixelated; margin-right: 4px;"> Recycle Bin
    </div>
  </div>

  <!-- Explorer Body -->
  <div style="display: flex; flex-grow: 1; min-height: 250px; background: #fff; border: 2px inset #dfdfdf; overflow: hidden;">
    <!-- Left Sidebar -->
    <div style="width: 150px; min-width: 150px; background: linear-gradient(180deg, #708090 0%, #ffffff 100%); padding: 12px 10px; border-right: 1px solid #808080; box-sizing: border-box;">
      <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px;">
        <img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_full-2.png" alt="" style="width: 28px; height: 28px; vertical-align: middle; image-rendering: pixelated;">
        <h2 style="margin: 0; font-size: 16px; font-weight: bold; color: #000; line-height: 1.1;">Recycle Bin</h2>
      </div>
      <div id="bin-sidebar-desc" style="font-size: 11px; color: #333; line-height: 1.3;">
        This folder contains files and folders that you have deleted from your computer.
      </div>
      <div style="border-top: 1px solid #808080; margin: 12px 0;"></div>
      <button onclick="emptyRecycleBin()" style="width: 100%; font-size: 11px; padding: 4px; cursor: pointer; font-weight: bold;">
        Empty Recycle Bin
      </button>
    </div>

    <!-- Right File List Grid -->
    <div style="flex-grow: 1; padding: 12px; overflow-y: auto; background: #ffffff;">
      <div id="bin-file-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 16px 12px;">

        <!-- Deleted File: passwords.txt -->
        <div class="bin-item" style="display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 4px;"
             onclick="openPasswordFile()">
          <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" alt="File" style="width: 32px; height: 32px; margin-bottom: 4px;" />
          <span style="font-size: 11px; color: #000; word-break: break-word;">passwords.txt</span>
        </div>

      </div>
      <div id="bin-empty-msg" style="display: none; text-align: center; color: #666; font-size: 11px; padding-top: 40px;">
        The Recycle Bin is empty.
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div style="display: flex; justify-content: space-between; padding: 2px 6px; background: #c0c0c0; border-top: 1px solid #fff; font-size: 11px; color: #000;">
    <span id="bin-status-count">1 object(s)</span>
    <span>4.2 KB</span>
  </div>
</div>

<script>
  function openPasswordFile() {
    // Resolves from the project root where index.html is running
    fetch('apps/notepad/passwords.txt')
      .then(res => {
        if (!res.ok) {
          throw new Error('HTTP error status ' + res.status);
        }
        return res.text();
      })
      .then(text => {
        if (typeof parent.openNotepad === 'function') {
          parent.openNotepad('passwords.txt - Notepad', text);
        }
      })
      .catch(err => {
        console.warn('Could not load passwords.txt:', err);
        if (typeof parent.openNotepad === 'function') {
          parent.openNotepad('passwords.txt - Notepad', 'Error: Could not load passwords.txt');
        }
      });
  }

  function emptyRecycleBin() {
    if (typeof parent.showRecycleBinError === 'function') {
      parent.showRecycleBinError();
    }
  }
</script>
