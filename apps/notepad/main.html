<div class="window" style="width: 450px; height: 320px; z-index: 300;">
  <div class="title-bar">
    <div class="title-bar-text">📝 <span class="notepad-title-text">Untitled - Notepad</span></div>
    <div class="title-bar-controls">
      <button aria-label="Close" class="notepad-close-btn"></button>
    </div>
  </div>
  <div class="window-body" style="height: calc(100% - 36px); padding: 4px; box-sizing: border-box; display: flex; flex-direction: column; background: #c0c0c0; user-select: none;">
    <div style="display: flex; gap: 12px; padding: 2px 4px; font-size: 11px; border-bottom: 1px solid #808080; margin-bottom: 4px;">
      <span style="cursor: pointer;"><u>F</u>ile</span>
      <span style="cursor: pointer;"><u>E</u>dit</span>
      <span style="cursor: pointer;"><u>S</u>earch</span>
      <span style="cursor: pointer;"><u>H</u>elp</span>
    </div>
    <textarea class="notepad-textarea" style="flex-grow: 1; resize: none; font-family: 'Courier New', monospace; font-size: 12px; padding: 6px; border: 2px inset #dfdfdf; background: #fff; box-sizing: border-box; outline: none;" placeholder="Type notes here..."></textarea>
    <div style="font-size: 10px; padding: 2px 2px 0 2px; color: #333; display: flex; justify-content: space-between;">
      <span>Ln 1, Col 1</span>
      <span>Windows 98 Notepad</span>
    </div>
  </div>
</div>
