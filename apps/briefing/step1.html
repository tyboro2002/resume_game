<p><strong>MISSION:</strong> Uncover the secrets locked inside this PC to learn about me.</p>
<p><strong>Step 1:</strong> Find my full name, open Internet Explorer, and navigate to <strong>oasis.com</strong> to verify my degree records.</p>
<hr />
<div style="margin-top: 8px;">
  <button id="hint-btn" onclick="showNextHint()">Show Hint (1/3)</button>
  <div id="hints-container" style="margin-top: 8px; color: #333; font-size: 11px;"></div>
</div>

<script>
  (function() {
    const hints = [
      "<em>Hint 1:</em> Click the Start button at the bottom-left corner of the taskbar to find the account owner's full name.",
      "<em>Hint 2:</em> Click the Microsoft Edge browser icon on the desktop.",
      "<em>Hint 3:</em> Type <code>oasis.com</code> into the Edge address bar and press Enter.",
      "<strong style='color: #b22222;'>Answer:</strong> Full Name: <strong>Tybo Verslype</strong>. Open Edge and navigate to <code>oasis.com</code>."
    ];
    let currentHintIndex = 0;

    window.showNextHint = function() {
      const container = document.getElementById('hints-container');
      const btn = document.getElementById('hint-btn');
      const totalHints = hints.length - 1;

      if (currentHintIndex < hints.length) {
        const p = document.createElement('p');
        p.style.margin = '4px 0';
        p.innerHTML = hints[currentHintIndex];
        container.appendChild(p);

        currentHintIndex++;

        if (currentHintIndex < totalHints) {
          btn.innerText = `Show Next Hint (${currentHintIndex + 1}/${totalHints})`;
        } else if (currentHintIndex === totalHints) {
          btn.innerText = "Reveal Answer";
        } else {
          btn.innerText = "Hide Hints & Answer";
        }
      } else {
        container.innerHTML = '';
        currentHintIndex = 0;
        btn.innerText = `Show Hint (1/${totalHints})`;
      }
    };
  })();
</script>
