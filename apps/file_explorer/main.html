<div class="window-body" style="margin: 0; padding: 0; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; background: #c0c0c0; user-select: none;">
  <!-- Explorer Menu Bar -->
  <div style="display: flex; gap: 12px; padding: 2px 6px; background: #c0c0c0; border-bottom: 1px solid #808080; font-size: 11px; color: #000;">
    <span style="cursor: pointer;"><u>F</u>ile</span>
    <span style="cursor: pointer;"><u>E</u>dit</span>
    <span style="cursor: pointer;"><u>V</u>iew</span>
    <span style="cursor: pointer;"><u>G</u>o</span>
    <span style="cursor: pointer;">F<u>a</u>vorites</span>
    <span style="cursor: pointer;"><u>H</u>elp</span>
  </div>

  <!-- Address Bar & Toolbar -->
  <div style="display: flex; align-items: center; gap: 6px; padding: 3px 6px; background: #c0c0c0; border-bottom: 2px inset #fff; font-size: 11px;">
    <button id="exp-back-btn" onclick="goBack()" disabled style="padding: 1px 6px; font-size: 11px; cursor: pointer;">
      ← Back
    </button>
    <span>Address</span>
    <div id="explorer-path" style="flex-grow: 1; background: #fff; border: 2px inset #dfdfdf; padding: 1px 4px; color: #000;">
      📁 C:\Personal
    </div>
  </div>

  <!-- Explorer Body -->
  <div style="display: flex; flex-grow: 1; min-height: 280px; background: #fff; border: 2px inset #dfdfdf; overflow: hidden;">
    <!-- Left Sidebar -->
    <div style="width: 160px; min-width: 160px; background: linear-gradient(180deg, #a6c8e0 0%, #ffffff 100%); padding: 12px 10px; border-right: 1px solid #808080; box-sizing: border-box;">
      <div style="display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px;">
        <span style="font-size: 28px;">🛈</span>
        <div>
          <h2 id="exp-side-title" style="margin: 0; font-size: 15px; font-weight: bold; color: #000;">Personal (C:)</h2>
          <span style="font-size: 10px; color: #444;">FAT32 File System</span>
        </div>
      </div>
      <div style="font-size: 11px; color: #333; line-height: 1.3;">
        Select an object to view its details or navigate directory contents.
      </div>
      <div style="border-top: 1px solid #808080; margin: 12px 0;"></div>
      <div style="font-size: 11px; color: #000080; text-decoration: underline; cursor: pointer;" onclick="if(parent.showCapacityProperties) parent.showCapacityProperties();">
        Capacity Properties
      </div>
    </div>

    <!-- Right File List Grid -->
    <div style="flex-grow: 1; padding: 12px; overflow-y: auto; background: #ffffff;">
      <div id="explorer-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 16px 12px;">
        <!-- Dynamic grid items load here -->
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div style="display: flex; justify-content: space-between; padding: 2px 6px; background: #c0c0c0; border-top: 1px solid #fff; font-size: 11px; color: #000;">
    <span id="exp-status-count">0 object(s)</span>
    <span>Local Disk (C:)</span>
  </div>
</div>

<script>
  let fileSystem = null;
  let currentFolderStack = [];

  function loadFileSystem() {
    fetch('apps/file_explorer/filesystem.json')
      .then(res => res.json())
      .then(data => {
        fileSystem = data;
        currentFolderStack = [fileSystem];
        renderCurrentFolder();
      })
      .catch(err => {
        console.error('Error loading filesystem.json:', err);
        document.getElementById('explorer-grid').innerHTML = '<p style="color:red; font-size:11px; padding:10px;">Failed to load directory structure.</p>';
      });
  }

  function renderCurrentFolder() {
    if (!fileSystem) return;
    const currentFolder = currentFolderStack[currentFolderStack.length - 1];
    const grid = document.getElementById('explorer-grid');
    const pathEl = document.getElementById('explorer-path');
    const backBtn = document.getElementById('exp-back-btn');
    const sideTitle = document.getElementById('exp-side-title');
    const statusCount = document.getElementById('exp-status-count');

    grid.innerHTML = '';

    let pathStr = 'C:\\Personal';
    for (let i = 1; i < currentFolderStack.length; i++) {
      pathStr += '\\' + currentFolderStack[i].name;
    }
    pathEl.innerText = '📁 ' + pathStr;
    sideTitle.innerText = currentFolder.name;
    statusCount.innerText = currentFolder.items.length + ' object(s)';
    backBtn.disabled = currentFolderStack.length <= 1;

    currentFolder.items.forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.style.cssText = "display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; padding: 4px;";

      itemDiv.innerHTML = `
        <img src="${item.icon}" alt="${item.name}" style="width: 32px; height: 32px; margin-bottom: 4px;" />
        <span style="font-size: 11px; color: #000; word-break: break-word;">${item.name}</span>
      `;

      if (item.type === 'folder') {
        itemDiv.onclick = () => {
          currentFolderStack.push(item);
          renderCurrentFolder();
        };
      } else if (item.type === 'file') {
        itemDiv.onclick = async () => {
          try {
            const res = await fetch(item.path);
            if (!res.ok) throw new Error('Network response failed');
            const fileText = await res.text();
            if (parent.openNotepad) {
              parent.openNotepad(item.title, fileText);
            }
          } catch (err) {
            console.warn('Could not load file:', item.path, err);
            if (parent.openNotepad) {
              parent.openNotepad(item.title, 'Error: Could not load contents from ' + item.path);
            }
          }
        };
      }

      grid.appendChild(itemDiv);
    });
  }

  function goBack() {
    if (currentFolderStack.length > 1) {
      currentFolderStack.pop();
      renderCurrentFolder();
    }
  }

  loadFileSystem();
</script>
